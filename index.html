html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-ui);-webkit-font-smoothing:antialiased}
body{min-height:100vh}
button{font:inherit;color:inherit}
a{color:var(--amber)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.ic{width:16px;height:16px;flex:none;display:block}
.wrap{max-width:980px;margin:0 auto;padding:24px 16px 96px}
/* header */
header.top{position:sticky;top:0;z-index:20;background:rgba(14,15,17,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
header.top .in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:56px}
.brand{font:600 22px/1 var(--font-d);letter-spacing:.01em;cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand i{display:inline-block;width:8px;height:20px;background:var(--amber);transform:skewX(-16deg)}
.chips{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;height:28px;border:1px solid var(--line2);background:transparent;border-radius:8px;padding:0 12px;font-size:12px;color:var(--ink2);cursor:pointer;white-space:nowrap;transition:color .15s var(--ease),border-color .15s var(--ease),background-color .15s var(--ease)}
.chip:hover{background:var(--panel2);color:var(--ink)}
.chip.on{border-color:rgba(242,194,0,.45);color:var(--amber)}
.tally{display:inline-flex;align-items:center;gap:4px;font:12px/1 var(--font-m);font-variant-numeric:tabular-nums;color:var(--mute);padding:0 4px;white-space:nowrap}
.tally .ic{width:14px;height:14px}
/* type */
h1,h2,h3{margin:0;font-weight:600}
strong,b{font-weight:600}
h1{font:600 48px/1.04 var(--font-d);letter-spacing:-.01em;text-wrap:balance}
h2{font:600 32px/1.1 var(--font-d)}
h3{font:600 15px/1.4 var(--font-ui)}
p{margin:0}
.sub{color:var(--ink2)}
.meta{color:var(--mute);font-size:12px;line-height:16px}
.mono{font-family:var(--font-m);font-variant-numeric:tabular-nums}
.page-h{margin:16px 0 8px}
.page-sub{color:var(--ink2);margin-bottom:20px;max-width:44rem}
/* surfaces */
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card h3+p{margin-top:8px}
.tile{display:block;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;cursor:pointer;text-align:left;position:relative;transition:background-color .15s var(--ease),border-color .15s var(--ease)}
.tile:hover{background:var(--panel2);border-color:var(--line2)}
.tile .k{font:600 24px/1.1 var(--font-d)}
.tile .d{color:var(--ink2);font-size:14px;margin-top:4px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;border:1px solid var(--line2);background:var(--raised);border-radius:10px;padding:0 16px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink);white-space:nowrap;box-shadow:inset 0 1px 0 rgba(255,255,255,.06);transition:background-color .15s var(--ease),border-color .15s var(--ease),color .15s var(--ease),transform .12s var(--ease)}
.btn:hover{background:#2d3035}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--amber);border-color:var(--amber);color:#14120c;box-shadow:none}
.btn.pri:hover{background:#ffd21a;border-color:#ffd21a}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--ink2);padding:0 12px 0 8px}
.btn.ghost:hover{background:var(--panel2);color:var(--ink)}
.btn.lg{height:48px;padding:0 20px;font-size:15px}
.btn.danger{border-color:rgba(255,90,54,.4);color:#ff8a6e}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stat{font:600 40px/1 var(--font-d);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--raised);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green)}
.bar.amber>i{background:var(--amber)}
.pill{display:inline-flex;align-items:center;height:20px;font:12px/1 var(--font-ui);padding:0 8px;border-radius:6px;background:var(--raised);color:var(--ink2);white-space:nowrap}
.pill.mono{font-family:var(--font-m)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#55585e;flex:none}
.dot.learning{background:var(--amber2)}.dot.shaky{background:var(--red)}.dot.mastered{background:var(--green)}
/* home */
.hero{display:grid;grid-template-columns:1fr 320px;gap:32px;align-items:center;margin:24px 0 32px}
.eyebrow{font-size:13px;color:var(--mute);margin-bottom:12px}
.lede{color:var(--ink2);font-size:17px;line-height:1.55;margin:16px 0 24px;max-width:34rem}
.mastery .fig{font:600 56px/1 var(--font-d);font-variant-numeric:tabular-nums;margin:12px 0 16px}
.mastery .fig span{font-size:24px;color:var(--mute);margin-left:4px}
.stack{display:flex;height:8px;border-radius:4px;background:var(--raised);overflow:hidden}
.stack i{display:block;height:100%}
.stack .mastered{background:var(--green)}.stack .learning{background:var(--amber2)}.stack .shaky{background:var(--red)}
.legend{list-style:none;padding:0;margin:16px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;font-size:13px;color:var(--ink2)}
.legend li{display:flex;align-items:center;gap:8px}
.legend b{margin-left:auto;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.mastery .meta{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.route-h{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px}
.route-next{font-size:15px;margin-top:4px}
.route-next b{font-weight:600}
.lane{position:relative;display:grid;grid-template-columns:repeat(var(--k),1fr);height:56px;background:var(--bg2);border-radius:10px;align-items:center}
.lane:before{content:'';position:absolute;left:0;right:0;top:8px;bottom:8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.paint{position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;background:repeating-linear-gradient(90deg,rgba(236,233,225,.16) 0 14px,transparent 14px 26px)}
.paint.on{right:auto;width:var(--p);background:repeating-linear-gradient(90deg,var(--amber) 0 14px,transparent 14px 26px)}
.lane .s{position:relative;z-index:1;justify-self:center;width:100%;max-width:32px;height:32px;display:grid;place-items:center;background:none;border:0;padding:0;cursor:pointer;border-radius:8px}
.lane .s i{display:block;width:12px;height:12px;border-radius:50%;background:var(--bg2);border:2px solid rgba(236,233,225,.3);box-sizing:border-box;transition:border-color .15s var(--ease)}
.lane .s:hover i{border-color:var(--ink)}
.lane .s.shaky i{border-color:var(--red)}
.lane .s.done i{background:var(--green);border-color:var(--green)}
.lane .s.cur i{width:18px;height:18px;border:3px solid var(--amber)}
.chapters{display:grid;grid-template-columns:repeat(var(--k),1fr);margin-top:8px}
.chapters span{font-size:12px;color:var(--mute);border-left:1px solid var(--line2);padding-left:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lower{display:grid;grid-template-columns:1fr 320px;gap:16px;margin-top:16px;align-items:start}
.modes{padding:4px}
.mode{position:relative;display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:none;border:0;border-radius:12px;padding:16px;cursor:pointer;transition:background-color .15s var(--ease)}
.mode+.mode:before{content:'';position:absolute;left:16px;right:16px;top:0;border-top:1px solid var(--line)}
.mode:hover{background:var(--panel2)}
.mode>div{flex:1;min-width:0}
.settings .card p{margin:8px 0 16px}
.mode .t{font:600 22px/1.1 var(--font-d)}
.mode .d{color:var(--ink2);font-size:14px;margin-top:4px}
.mode .meta{margin-left:auto;font-family:var(--font-m);white-space:nowrap}
.mode .ic{color:var(--mute)}
.stackcol{display:grid;gap:16px}
.links{display:flex;gap:4px;margin-top:24px;flex-wrap:wrap}
.links .btn{padding:0 12px}
/* quiz */
.q-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.q-top strong{font-weight:600;font-size:15px;text-align:center}
.q-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;font-size:12px;color:var(--mute)}
.q-prompt{font:600 22px/1.35 var(--font-ui);margin:4px 0 20px;text-wrap:pretty}
.q-prompt .tf{display:block;font-size:13px;font-weight:400;color:var(--mute);margin-bottom:4px}
.choices{display:grid;gap:8px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 16px 12px 12px;cursor:pointer;font-size:16px;line-height:24px;transition:background-color .15s var(--ease),border-color .15s var(--ease)}
.choice:hover:not(:disabled){background:var(--raised);border-color:var(--line2)}
.choice .n{font:600 12px/1 var(--font-ui);min-width:24px;height:24px;display:grid;place-items:center;color:var(--ink2);flex:none;border:1px solid var(--line2);border-bottom-width:2px;border-radius:6px;background:var(--bg2)}
.choice.right{border-color:rgba(76,195,138,.55);background:#132219}
.choice.right .n{color:var(--green)}
.choice.wrong{border-color:rgba(255,90,54,.55);background:#26150f}
.choice.wrong .n{color:var(--red)}
.choice.picked{border-color:rgba(242,194,0,.55)}
.choice:disabled{cursor:default}
.fb{margin-top:16px;border-left:3px solid var(--green);background:var(--panel2);border-radius:4px 10px 10px 4px;padding:12px 16px}
.fb.bad{border-left-color:var(--red)}
.fb .fact{color:var(--ink2);font-size:14px;margin-top:8px}
.fb .meta{margin-top:8px}
.prog{height:4px;background:var(--raised);border-radius:2px;margin-bottom:16px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--amber)}
.keys{margin-top:12px}
textarea.recall{width:100%;min-height:80px;background:var(--bg2);border:1px solid var(--line2);color:var(--ink);border-radius:10px;padding:12px;font:inherit;resize:vertical}
textarea.recall:focus{outline:none;border-color:rgba(242,194,0,.6)}
.diag{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px}
.diag svg{width:100%;height:auto;display:block;max-height:340px}
.diag img{width:100%;height:auto;display:block;border-radius:4px;background:#fff;max-height:380px;object-fit:contain}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;padding:2px;gap:2px;vertical-align:middle}
.seg button{background:transparent;border:0;border-radius:6px;height:24px;padding:0 8px;font-size:12px;color:var(--mute);cursor:pointer;transition:background-color .15s var(--ease),color .15s var(--ease)}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--raised);color:var(--ink);font-weight:600}
.results .stat.verdict{font-size:32px}
.review .q{font-weight:600;margin:4px 0}
.review .you,.review .ans{font-size:14px}
.review .fact{color:var(--ink2);font-size:13px;margin-top:8px}
/* campaign */
.road{position:relative;padding-left:36px}
.road:before{content:'';position:absolute;left:14px;top:8px;bottom:8px;width:4px;background:repeating-linear-gradient(var(--amber) 0 14px,transparent 14px 26px);opacity:.5;border-radius:2px}
.stop{position:relative;margin-bottom:8px}
.stop:before{content:'';box-sizing:border-box;position:absolute;left:-26px;top:26px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid rgba(236,233,225,.3)}
.stop.cur:before{left:-28px;top:24px;width:16px;height:16px;border:3px solid var(--amber)}
.stop.done:before{background:var(--green);border-color:var(--green)}
.stop .k{font-size:22px}
.stop-r{min-width:160px;text-align:right}
.stop-r .bar{margin:8px 0 4px}
.sec-h{margin:32px 0 12px}
.sec-h h3{color:var(--ink2)}
.lock{opacity:.55}
/* map */
.map2{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}
.map2-body{position:relative}
.map2-body .sec-h:first-child{margin-top:0}
.sys-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.sys{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 12px 12px;transition:opacity .16s var(--ease)}
.sys-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:0 8px 8px}
.sys-t{font:600 20px/1.1 var(--font-d)}
.cpt{display:flex;align-items:center;gap:8px;width:100%;min-height:36px;padding:6px 8px;background:none;border:0;border-radius:8px;text-align:left;font-size:14px;line-height:20px;color:var(--ink2);cursor:pointer;transition:background-color .15s var(--ease),color .15s var(--ease),opacity .16s var(--ease)}
.cpt:hover{background:var(--panel2);color:var(--ink)}
.cpt .dot{box-shadow:0 0 0 2px transparent;transition:box-shadow .15s var(--ease)}
.cpt.on{background:var(--raised);color:var(--ink)}
.cpt.on .dot{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--amber)}
.cpt.nb{color:var(--ink)}
.cpt.nb .dot{box-shadow:0 0 0 2px var(--bg),0 0 0 3px rgba(242,194,0,.6)}
.focus .cpt:not(.on):not(.nb){opacity:.35}
.focus .sys:not(.nbs){opacity:.6}
#mlines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#mlines path{fill:none;stroke:var(--amber);stroke-width:1.5;stroke-linecap:round;opacity:.85;transition:stroke-dashoffset .28s var(--ease)}
.mpanel{position:sticky;top:72px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;max-height:calc(100vh - 96px);overflow:auto}
.mpanel p{margin-top:8px}
.mpanel .x{display:none}
.map-legend{display:flex;gap:16px;font-size:12px;color:var(--ink2)}
.map-legend span{display:inline-flex;align-items:center;gap:8px}
/* lab */
.lab canvas{width:100%;height:300px;display:block;border-radius:var(--r);border:1px solid var(--line);background:#111}
.ctl{display:grid;grid-template-columns:96px 1fr 104px;gap:12px;align-items:center;margin:8px 0}
.ctl .read{font-size:24px;white-space:nowrap;text-align:right}
.ctl select{width:100%}
input[type=range]{accent-color:var(--amber);width:100%}
select{background:var(--raised);color:var(--ink);border:1px solid var(--line2);border-radius:8px;height:32px;padding:0 8px;font:inherit;font-size:14px}
.read{font:600 28px/1 var(--font-d);font-variant-numeric:tabular-nums}
.readout{grid-template-columns:1fr 1fr;gap:16px 12px}
.lab-ref{margin:4px 0}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.k-y{color:var(--amber)}.k-o{color:var(--orange)}.k-r{color:var(--red)}.k-g{color:var(--green)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--raised);border:1px solid var(--line2);padding:12px 16px;border-radius:10px;z-index:50;font-size:14px;animation:toast-in .2s var(--ease)}
@keyframes toast-in{from{opacity:0;transform:translate(-50%,8px)}}
.kbd{display:inline-block;font:600 11px/18px var(--font-ui);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 6px;color:var(--ink2);background:var(--bg2)}
.fr{color:var(--mute);font-size:13px}
/* sign-in */
.auth-in{display:grid;grid-template-columns:1fr 360px;gap:32px;align-items:center;min-height:calc(100vh - 200px)}
.auth-card{display:flex;flex-direction:column}
.auth-card h3{margin-bottom:16px}
.auth-card label{font-size:13px;color:var(--ink2);margin-bottom:8px}
.auth-card input{height:44px;background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:0 12px;color:var(--ink);font:15px var(--font-ui);margin:0 0 16px;transition:border-color .15s var(--ease)}
.auth-card input:focus{outline:none;border-color:rgba(242,194,0,.6)}
.auth-card .btn{margin-top:8px;width:100%}
.auth-card .btn:disabled{opacity:.6;cursor:default}
.auth-err{color:#ff8a6e;font-size:13px;margin-top:12px;min-height:20px}
.auth-err:empty{display:none}
/* settings: progress card */
.progress-card{grid-column:1/-1}
.progress-card .push{flex:1}
.settings .progress-card p.sub{margin:8px 0 8px}
.settings .progress-card .sync-line{display:flex;align-items:center;gap:8px;margin:0 0 16px}
.dot.ok{background:var(--green)}
.dot.wait{background:var(--amber2)}
@media (max-width:980px){.map2{grid-template-columns:1fr}.mpanel{position:static;max-height:none}}
@media (max-width:720px){
  .hero,.lower{grid-template-columns:1fr}
  .hero{gap:24px;margin:8px 0 16px}
  .mode .meta{display:none}
  h1{font-size:38px}
  h2{font-size:28px}
  .chapters{display:none}
  .q-prompt{font-size:20px}
  .ctl{grid-template-columns:72px 1fr 96px}
  header.top .in{flex-wrap:wrap;row-gap:8px}
  .chips{margin-left:0;justify-content:flex-start;width:100%}
  .chips .hide-s{display:none}
  .route-h .btn{display:none}
  .stop-r{min-width:0;width:100%;text-align:left}
  .auth-in{grid-template-columns:1fr;min-height:0;gap:24px;margin-top:8px}
  .map2{grid-template-columns:1fr}
  .cpt{min-height:44px}
  .mpanel{position:fixed;left:8px;right:8px;bottom:8px;top:auto;max-height:55vh;z-index:30;transform:translateY(calc(100% + 16px));transition:transform .24s var(--ease);border-color:var(--line2)}
  .mpanel.open{transform:none}
  .mpanel .x{display:inline-flex;position:absolute;top:8px;right:8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="brand" data-go="home"><i></i>6R Ride Prep</div>
  <div class="chips" id="chips"></div>
</div></header>
<main class="wrap" id="app"></main>
<main class="wrap auth" id="auth" hidden>
  <div class="auth-in">
    <div>
      <p class="eyebrow">SAAQ Class 6R knowledge test · motorcycle section</p>
      <h1>Ride the guide on any device</h1>
      <p class="lede">Sign in and your mastered concepts, due reviews and campaign stop follow you between your phone and your laptop.</p>
    </div>
    <form class="card auth-card" id="auth-form" novalidate>
      <h3>Sign in</h3>
      <label for="auth-email">Email</label>
      <input id="auth-email" type="email" autocomplete="email" autocapitalize="off" spellcheck="false">
      <label for="auth-pass">Password</label>
      <input id="auth-pass" type="password" autocomplete="current-password">
      <button type="submit" class="btn pri lg" id="auth-go">Sign in</button>
      <p class="auth-err" id="auth-err" role="alert"></p>
    </form>
  </div>
</main>
<script>window.CONFIG = { bookCrops: false }; /* turned on after sign-in, once the book illustrations load from moto_assets */</script>
<script>window.CROPIMG = {}; /* filled after sign-in: the SAAQ book crops are login-only, never in this public file */</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>/* ONE storage layer. The app only ever calls Store.load() / Store.save(state).
   Offline build: LocalAdapter (browser localStorage).
   Website build (moto.zxyframe.ca): the sign-in gate below starts SupabaseAdapter. 'moto6r.state.v1' stays the offline cache
   (same shape as the offline build's exports), 'moto6r.sync.v1' = { uid, savedAt, dirty }, public.moto_progress holds one row per user (RLS).
*/
(function () {
  const KEY = 'moto6r.state.v1', META = 'moto6r.sync.v1', warn = (m, e) => console.warn('[moto6r] ' + m, e);
  const SB_URL = 'https://chqogvxuoeypraplllhx.supabase.co', SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNocW9ndnh1b2V5cHJhcGxsbGh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2ODQ4MzAsImV4cCI6MjEwODI2MDgzMH0.y9sWNcV3V08P9G4_rTvq-1iizxDRDrAyyepX0NdcMh0'; // public anon key, RLS protects the data

  const LocalAdapter = {
    name: 'local',
    async load() {
      try { const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; } catch (e) { warn('local load failed', e); return null; }
    },
    async save(state) {
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { warn('local save failed, kept in memory', e); }
    },
  };

  /* Website version: localStorage is the offline cache, the moto_progress row the shared copy; the newer savedAt wins. */
  function SupabaseAdapter(sb, uid) {
    const rd = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { warn('cache read failed', e); return null; } };
    const wr = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { warn('cache write failed', e); } };
    let meta = rd(META), queue = Promise.resolve();
    if (!meta || meta.uid !== uid) meta = { uid, savedAt: 0, dirty: false };
    const local = () => (meta.savedAt > 0 ? rd(KEY) : null), setMeta = m => wr(META, Object.assign(meta, m));
    const take = row => { wr(KEY, row.state); setMeta({ savedAt: row.at, dirty: false }); return row.state; };
    const fail = (m, e) => { A.lastError = e; warn(m, e); };
    const upsert = async () => { // clears dirty only if nothing was saved while the request ran
      if (!meta.dirty) return;
      const at = meta.savedAt, { error } = await sb.from('moto_progress').upsert({ user_id: uid, state: local(), updated_at: new Date(at).toISOString() });
      if (error) throw error;
      if (meta.savedAt === at) setMeta({ dirty: false });
    };
    const A = {
      name: 'supabase', meta, lastError: null,
      async pull() {
        const { data, error } = await sb.from('moto_progress').select('state,updated_at').eq('user_id', uid).maybeSingle();
        if (error) throw error;
        return data ? { state: data.state, at: Date.parse(data.updated_at) } : null;
      },
      push() { return (queue = queue.then(upsert, upsert)); }, // one upsert at a time: an older state never lands after a newer one
      async load() {
        try { const row = await A.pull(); A.lastError = null; if (row && (row.at > meta.savedAt || local() == null)) return take(row); if (meta.dirty) await A.push(); } catch (e) { fail('load: sync failed, using the copy on this device', e); }
        return local();
      },
      async save(state) { wr(KEY, state); setMeta({ savedAt: Date.now(), dirty: true }); try { await A.push(); A.lastError = null; } catch (e) { fail('save: sync failed, kept on this device', e); } },
      async refresh() {
        try { await A.push(); const row = await A.pull(); A.lastError = null; if (row && row.at > meta.savedAt) return take(row); } catch (e) { fail('refresh: sync failed', e); }
        return null;
      },
    };
    return A;
  }

  let adapter = LocalAdapter, mem = null, timer = null, fire = null, ready = null, onRemote = null, sb = null, entered = false;
  window.Store = {
    ready: new Promise(r => (ready = r)),
    email: '',
    use(a) { adapter = a; },
    start(a) { adapter = a; ready(); },
    get adapterName() { return adapter.name; },
    async load() { mem = (await adapter.load()) || null; return mem; },
    save(state) { mem = state; clearTimeout(timer); timer = setTimeout(fire = () => { fire = null; return adapter.save(mem); }, 250); },
    flush() { clearTimeout(timer); return fire ? fire() : Promise.resolve(); },
    async reset() { mem = null; await adapter.save(null); try { localStorage.removeItem(KEY); } catch (e) { warn('reset: cache clear failed', e); } },
    exportJSON() { return JSON.stringify(mem); },
    onRemote(fn) { onRemote = fn; },
    async refresh() { await Store.flush(); const s = adapter.refresh && (await adapter.refresh()); if (s) { mem = s; if (onRemote) onRemote(s); } },
    status() { return { adapter: adapter.name, pending: !!(adapter.meta && adapter.meta.dirty), error: !!adapter.lastError }; },
    async signOut() {
      await Store.flush();
      if (adapter.meta && adapter.meta.dirty) await adapter.push().catch(e => warn('sign-out: sync failed', e));
      if (adapter.meta && adapter.meta.dirty) return 'pending';
      try { const { error } = await sb.auth.signOut(); if (error) warn('sign-out refused', error); } catch (e) { warn('sign-out failed', e); }
      try { localStorage.removeItem(KEY); localStorage.removeItem(META); } catch (e) { warn('sign-out: cache clear failed', e); }
      location.reload();
    },
  };

  /* Sign-in gate (same pattern as track.zxyframe.ca): #auth while signed out, #app + #chips once there is a session. */
  const $ = id => document.getElementById(id), err = $('auth-err'), go = $('auth-go'), NOLIB = 'Couldn’t load the sign-in library. Check your connection and reload';
  const gate = on => { $('auth').hidden = on; $('app').hidden = !on; $('chips').hidden = !on; $('chips').style.display = on ? '' : 'none'; }; // .chips sets display:flex, so [hidden] alone does not hide it
  function showAuth(msg) { gate(false); err.textContent = msg || ''; go.disabled = false; go.textContent = 'Sign in'; }
  function enter(session) { entered = true; gate(true); Store.email = session.user.email || ''; Store.start(SupabaseAdapter(sb, session.user.id)); loadCrops(); }
  async function loadCrops() { // the SAAQ book crops are login-only: they live in moto_assets, never in this public file
    try {
      const { data: row, error } = await sb.from('moto_assets').select('data').eq('key', 'cropimg').maybeSingle();
      if (error || !row || !row.data) throw error || new Error('no cropimg row in moto_assets');
      window.CROPIMG = row.data; window.CONFIG.bookCrops = true;
      if ((location.hash || '#home').startsWith('#diagrams')) window.dispatchEvent(new Event('hashchange'));
    } catch (e) { warn('book illustrations failed to load', e); }
  }
  $('auth-form').addEventListener('submit', async ev => {
    ev.preventDefault();
    const em = $('auth-email').value.trim(), pw = $('auth-pass').value;
    if (!sb) return showAuth(NOLIB);
    if (!em || !pw) { err.textContent = 'Enter your email and password'; return; }
    go.disabled = true; go.textContent = 'Signing in…'; err.textContent = '';
    try {
      const r = await sb.auth.signInWithPassword({ email: em, password: pw });
      if (r.error) { warn('sign-in refused', r.error); showAuth(/invalid login/i.test(r.error.message) ? 'Wrong email or password' : r.error.message); }
      else { $('auth-pass').value = ''; enter(r.data.session); }
    } catch (e) { warn('sign-in failed', e); showAuth('Couldn’t reach the server. Try again'); }
  });
  addEventListener('pagehide', () => Store.flush());
  document.addEventListener('visibilitychange', () => { if (entered && !document.hidden) Store.refresh(); });
  addEventListener('online', () => { if (entered) Store.refresh(); });
  (async () => {
    if (!window.supabase || !window.supabase.createClient) { warn('supabase-js did not load', window.supabase); return showAuth(NOLIB); }
    sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
    sb.auth.onAuthStateChange(evt => { if (evt === 'SIGNED_OUT' && entered) location.reload(); });
    try { const r = await sb.auth.getSession(); if (r.data && r.data.session) enter(r.data.session); else showAuth(''); } catch (e) { warn('session check failed', e); showAuth(''); }
  })();
})();
</script>

C({ id: 'basic-mount', n: 'n4', p: '45', t: 'Mounting',

C({ id: 'start', n: 'n4', p: '38, 47', t: 'Starting sequence',
  f: 'Ignition ON → neutral → kill switch ON → starter → wait for idle. With a choke: open choke after neutral, then gradually close it to normal idle and close completely. The starter works once the ignition is ON and you squeeze the clutch or are in neutral. Riding before the engine warms up raises accident risk (misfire).',

C({ id: 'tech-scan', n: 'n5', p: '49', t: 'Scanning the right areas',
  f: 'Motorcyclists steer where they look. Straight line: look as far ahead as possible. Turn/curve: look toward the exit point. Scan your lane, adjacent lanes, roadsides. Don’t stare at what you want to avoid.',
  fr: 'balayage visuel', links: ['man-obstacle', 'man-curve', 'ctl-nolook'],
  why: ['Why shouldn’t you stare at a pothole you want to avoid?', 'The motorcycle tends to go where you are looking', 'Staring makes the brakes lock', 'It reduces the gyroscopic effect', 'It turns your signal off'],

  ] });

C({ id: 'tech-clutch', n: 'n5', p: '52', t: 'Friction point',
  f: 'The friction point is where engine power begins to reach the rear wheel and it starts to turn. You feel the rear wheel edge forward, the front suspension dips and the engine speed drops. Clutch control helps you start smoothly and keep balance at low speed.',
  fr: 'point de friction', links: ['ctl-clutch', 'man-start'],
  why: ['Why practise finding the friction point?', 'It lets you start smoothly and keep your balance at low speed', 'It shuts off the engine', 'It is how you downshift two gears', 'It sets the idle speed'],

    ['tf', 'Controlling the clutch helps you maintain your balance when executing manoeuvres at low speeds.', true],
  ] });

C({ id: 'tech-throttle', n: 'n5', p: '54', t: 'Throttle control',
  f: 'Control your right wrist and the force you apply; practice is the only way. Poor throttle control can cause sudden unintended acceleration and loss of control — even on a straight road in good weather. Smooth throttle also cuts fuel use.',
  links: ['ctl-throttle', 'eco'],
  why: ['Why does the guide say accidents can happen even on a straight empty road?', 'Poor throttle control can make you accelerate suddenly and lose control', 'Straight roads have more potholes', 'ABS fails on straights', 'Gyroscopic effect disappears on straights'],
  q: [
    ['tf', 'Controlling the throttle enables you to maintain a constant speed.', true],
  ] });

C({ id: 'tech-brakes', n: 'n5', p: '55', t: 'Braking technique',
  f: 'A locked wheel will almost always cause a fall. Brake gradually with BOTH wheels at once. The front is used more than the rear because it has more braking power — but the guide’s exercise key (p. 175) marks “more force on the front lever” as FALSE: you gauge the force on lever and pedal together. At 50 km/h or more: release throttle → gentle rear pedal → gradually squeeze front (weight shifts forward, fork dips) → keep gentle rear pressure to stabilize → release at desired speed → adjust throttle.',
  links: ['ctl-brakes', 'man-brake'],
  why: ['Why apply both brakes, gradually?', 'A locked wheel almost always causes a fall; coordinated gradual braking prevents lock-up', 'Using both brakes saves fuel', 'The front brake only works with the rear', 'It keeps the engine running'],
  q: [
    ["recall", "What can happen if you push too hard on the rear brake pedal?", "The rear wheel might lock up", "The front wheel lifts", "The engine stalls safely", "Nothing — the rear brake is weak"],
    ['recall', 'If either wheel locks up while braking, what will almost always happen?', 'A fall', 'A shorter stop', 'Nothing, the tire regrips', 'The engine stalls safely'],
    ['recall', 'At 50 km/h or more, which brake do you apply FIRST (gently) after releasing the throttle?', 'The rear brake pedal', 'The front brake lever', 'Both equally hard', 'Neither — downshift instead'],
    ['tf', 'Braking on a motorcycle must be done gradually and involve both brakes.', true],
    ['tf', 'Proper coordination of the two brakes requires that you exert greater force on the front brake lever.', false],
    ['tf', 'In most cases, the front brake is used more than the rear because it has greater braking power.', true],
  ] });

C({ id: 'tech-counterbal', n: 'n5', p: '56–57', t: 'Counterbalancing (< 25 km/h)',

    ['num', 'Many accidents occur within what distance of the departure point?', '20 km', '2 km', '100 km', '200 km'],

// ───── n13 Conditions ─────
C({ id: 'cond-rain', n: 'n13', p: '139–140', t: 'Heat & rain',
  f: 'Heat: wear full gear anyway and hydrate. Rain: you tire and chill faster, the road is slippery, visibility drops, and water between the rotors and pads reduces braking. Dry the brakes regularly by GENTLY applying both brakes while riding with the throttle open. Avoid puddles (hidden potholes, hydroplaning). Chamois-lined gloves help wipe the visor.',
  links: ['spec-hydro', 'brk-types'],
  why: ['Why apply the brakes gently with the throttle open in the rain?', 'To dry the brakes and maintain braking ability', 'To warm the tires', 'To charge the battery', 'To signal to traffic'],
  q: [
    ["tf", "Avoid riding through puddles: they may hide potholes.", true],
    ['recall', 'How do you dry your brakes in the rain?', 'Gently apply both brakes while riding with the throttle open', 'Brake hard once every kilometre', 'Ride with the clutch in', 'Use only the rear brake'],
    ['tf', 'Water can infiltrate between the brake rotors and pads and increase braking distance.', true],
    ['tf', 'To maintain your braking capacity in the rain, you must brake at regular intervals to dry out your brakes.', true],
  ] });

C({ id: 'cond-fog', n: 'n13', p: '140–141', t: 'Fog',
  f: 'Most frequent at sunrise or sunset or with a temperature change. Better not to ride; pulling over in a safe spot (hazards on if you have them) may be preferable. Don’t speed up to keep sight of taillights or because someone’s close behind. If you must: slow down, check more often, increase margins, bright/reflective gear, LOW beams, safest third (away from oncoming/parked), clean visor.',
  links: ['vis-speed', 'cond-night'],
  why: ['Why does the guide say you’re better off not riding in fog?', 'It greatly reduces visibility and makes it hard for others to see you and judge your distance', 'Fog makes engines overheat', 'Fog is illegal to ride in', 'Fog only affects cars'],

C({ id: 'cond-night', n: 'n13', p: '141–142', t: 'Night',

  links: ['cond-fog', 'gear-eyes', 'pass'],
  why: ['Why does the guide suggest limiting passing at night?', 'It is harder to judge speed and distance of other vehicles in the dark', 'Passing is illegal at night', 'Headlights must be off to pass', 'Lane lines are invisible'],

C({ id: 'cond-wind', n: 'n13', p: '142–143', t: 'Wind',
  f: 'Hits suddenly, especially on light bikes; crosswinds can push you out of your lane. Obstacles (trees, trucks, overpasses) can briefly block it. Ill-fitting gear amplifies it. If you must ride: slow down, increase margins, hold bars firmly, countersteer lightly against crosswinds, ride the MIDDLE third.',
  links: ['lane-thirds', 'tech-countersteer'],
  why: ['Why the middle third in high winds?', 'It gives you the most room if a gust pushes you off course', 'There’s no oil there', 'Trucks can’t pass you', 'It’s required by law'],
  q: [

    ['tf', 'To compensate for the force of the wind, you may have to countersteer.', true],
    ['tf', 'Crosswinds can cause your motorcycle to swerve out of the third of the lane you are travelling in.', true],
  ] });

C({ id: 'cond-gravel', n: 'n13', p: '143–144', t: 'Dirt & gravel roads',
  f: 'Less traction than asphalt; handlebars/front wheel may wobble — stay relaxed, don’t fight it. Avoid sudden braking. Approaching: brake as long as possible while still on the PAVEMENT. On it: keep the reduced speed, scan, hold bars firmly with relaxed arms/wrists, lift your body slightly and shift weight to the REAR, no abrupt moves, bigger margins.',
  links: ['phys-traction', 'spec-wobble'],
  why: ['Why brake before reaching the gravel?', 'Pavement offers more traction, so slow down while you still have it', 'Gravel damages brakes', 'Brakes don’t work on gravel', 'To warn the vehicle behind'],

    ['recall', 'On gravel, how should you position your weight?', 'Lift slightly and shift weight toward the rear', 'Lean far forward', 'Sit heavily and lock your arms', 'Shift weight to one side'],
    ['tf', 'Dirt or gravel roads give you the same degree of traction as asphalt pavement.', false],
    ['tf', 'Travelling on a dirt or gravel road can cause shimmying or wobbling.', true],
    ['tf', 'Whatever surface you are on, the risk of skidding is always the same.', false],
    ['tf', 'Braking distance is the same on asphalt pavement as on a gravel road.', false],
  ] });

C({ id: 'cond-rough', n: 'n13', p: '144', t: 'Rough roads',
  f: 'Avoid bumps, debris and potholes where possible. Slow down, hold bars firmly, hug the tank with your knees, look far ahead. After a pothole or debris, stop safely and check tires and rims.',

  why: ['Why check your tires and rims after hitting a pothole?', 'The impact can damage them', 'It’s required by law', 'To reset ABS', 'To let the engine cool'],

  ] });

C({ id: 'cond-slippery', n: 'n13', p: '145', t: 'Slippery surfaces by season',
  f: 'Spring: dust, sand, gravel residue. Summer: flooding rain, oily residue. Fall: leaves, cold pavement. Also slippery: metal bridge surfaces, painted lines (especially wet), caulked cracks. Losses of traction show up when braking, accelerating, turning or in curves. Approaching: slow as much as possible. On it: hold bars firmly, no abrupt moves, bigger margins, no sudden braking.',
  links: ['phys-traction', 'pit-rail'],
  why: ['Why reduce speed in a slippery curve?', 'Less speed means less lean angle in the curve', 'Slippery curves are shorter', 'To activate ABS', 'To read the warning sign'],

    ['tf', 'The lines painted on the pavement are never slippery.', false],
  ] });

C({ id: 'gear-helmet', n: 'n16', p: '203–204, 215–216', t: 'Helmet: choosing & fitting',

  fr: 'casque', links: ['gear-standards', 'gear-life', 'gear-eyes'],

C({ id: 'gear-standards', n: 'n16', p: '212', t: 'Helmet law & standards',

  links: ['gear-helmet'],
  why: ['Why might a helmet show no DOT sticker yet still be legal?', 'It can carry another recognized standard’s label on the inside', 'DOT stickers are optional everywhere', 'Only racing helmets have labels', 'It isn’t legal'],

    ['recall', 'Which helmet standard is the most common in Québec and the minimum requirement?', 'DOT', 'Snell', 'ECE 22', 'BSI'],
    ['recall', 'Where is the DOT label affixed?', 'On the outside of the helmet', 'On the inside of the visor', 'Under the chinstrap only', 'On the box'],
    ['not', 'Which is NOT one of the standards recognized in Québec?', 'ISO 9001', 'Snell', 'ECE Regulation 22', 'CSA CAN-3-D230'],
    ['num', 'A child is prohibited in a motorcycle sidecar if under what age or height?', 'Under 9 years or under 145 cm', 'Under 12 years or under 150 cm', 'Under 6 years or under 120 cm', 'Under 16 years'],
  ] });

C({ id: 'gear-eyes', n: 'n16', p: '207–209', t: 'Visors & eyewear',

C({ id: 'gear-glovesboots', n: 'n16', p: '209–211', t: 'Gloves & boots',
  f: 'Gloves: leather or Kevlar, cover hands and wrists, reinforced joints/palms, supple, adjustable wrist straps, not too big/small/tight. Leather ≥ 0.9 mm → about 2.5 s of abrasion resistance in a fall. Leave a little space at the fingertips; ideally two pairs. Boots: cover feet and ankles ideally up to the tibia, leather/abrasion-resistant, reinforced tips/soles, grip soles, water-repellent. AVOID steel toes (could sever toes). Leather ≥ 2.5 mm → about 5 s of abrasion resistance.',

<script>/* WebGL2 layers: physics-lab road + ambient background. Pure functions of (params, time). */
(function () {
  const VS = `#version 300 es
  in vec2 p; out vec2 uv; void main(){ uv = p*0.5+0.5; gl_Position = vec4(p,0.,1.); }`;

  const ROAD_FS = `#version 300 es
  precision highp float; in vec2 uv; out vec4 o;
  uniform vec2 res; uniform float t, speed, pd, rd, bd, fov, scroll, wet;
  float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
  void main(){
    vec2 q = uv; float aspect = res.x/res.y; float hz = 0.66;
    vec3 sky = mix(vec3(0.07,0.075,0.085), vec3(0.16,0.13,0.08), smoothstep(hz, 1.0, q.y)*0.0 + (1.0-smoothstep(hz,1.0,q.y))*0.6);
    if (q.y > hz) { o = vec4(sky,1.); return; }
    float d = hz - q.y;                       // screen distance below horizon
    float camH = 1.25, f = 1.15;              // camera height (m), focal
    float z = f*camH/d;                       // metres ahead
    float x = (q.x-0.5)*aspect*z/f;           // metres sideways
    vec3 col = vec3(0.10,0.12,0.10) + 0.03*hash(floor(vec2(x,z)*2.));   // verge
    float hw = 3.6;                         // one 3.6 m lane each side of centre
    if (abs(x) < hw*2.0) {
      float n = hash(floor(vec2(x*6., z*6.)));
      col = vec3(0.17,0.18,0.20) + n*0.025 + wet*vec3(0.0,0.02,0.05)*(0.5+0.5*sin(z*0.7+t));
      float lz = mod(z + scroll, 12.0);
      if (abs(x) < 0.08 && lz < 5.0) col = vec3(0.92,0.9,0.85);           // centre dashes
      if (abs(abs(x)-hw*2.0) < 0.12) col = vec3(0.95,0.76,0.0);          // edge lines
      if (mod(z, 10.0) < 0.06*z/6.0+0.05 && x < 0.0) col = mix(col, vec3(0.9), 0.35);  // 10 m ticks
      // stopping-distance bands in the rider's lane (x in [-half,0])
      if (x < 0.0 && x > -hw) {
        vec3 band = vec3(0.);
        if (z < pd) band = vec3(0.95,0.76,0.0);
        else if (z < pd+rd) band = vec3(0.94,0.54,0.14);
        else if (z < pd+rd+bd) band = vec3(1.0,0.35,0.21);
        if (z < pd+rd+bd) col = mix(col, band, 0.38);
        float edge = abs(z-(pd+rd+bd)); if (edge < 0.25*z/8.0+0.15) col = vec3(1.);
      }
    }
    float ang = degrees(atan(abs(x+1.8), z));                              // from rider position
    float dim = smoothstep(fov*0.5-2.0, fov*0.5+6.0, ang);
    col = mix(col, col*0.18, dim*0.85);
    col *= 0.75 + 0.25*smoothstep(0.0, 0.25, d);
    col = mix(col, sky, smoothstep(0.0, 0.03, 0.03-d)*0.8);
    o = vec4(col,1.);
  }`;

  function prog(gl, fs) {
    const mk = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
    const p = gl.createProgram(); gl.attachShader(p, mk(gl.VERTEX_SHADER, VS)); gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(p, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    return p;
  }

  function mount(canvas, fs, getUniforms) {
    const gl = canvas.getContext('webgl2', { antialias: false, premultipliedAlpha: false });
    if (!gl) return null;
    let p; try { p = prog(gl, fs); } catch (e) { console.warn(e); return null; }
    const U = {}; const u = n => (U[n] ??= gl.getUniformLocation(p, n));
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let raf = 0, alive = true, t0 = performance.now(), scroll = 0, last = t0;
    function frame(now) {
      if (!alive) return;
      const dpr = Math.min(devicePixelRatio || 1, 2), w = canvas.clientWidth * dpr | 0, h = canvas.clientHeight * dpr | 0;
      if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
      gl.viewport(0, 0, w, h); gl.useProgram(p);
      const t = reduce ? 0 : (now - t0) / 1000, dt = (now - last) / 1000; last = now;
      const un = getUniforms ? getUniforms() : {};
      if (!reduce && un.speed) scroll += (un.speed / 3.6) * dt * 0.35;
      gl.uniform2f(u('res'), w, h); gl.uniform1f(u('t'), t); gl.uniform1f(u('scroll'), scroll);
      for (const k in un) gl.uniform1f(u(k), un[k]);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);
    return { stop() { alive = false; cancelAnimationFrame(raf); } };
  }

  window.GL = {
    road(canvas, getU) { return mount(canvas, ROAD_FS, getU); },
  };
})();
</script>
<script>/* 6R Ride Prep — app logic. Mastery is tracked PER CONCEPT: every variant, why-question and
   scenario decision feeds the same concept record. All persistence goes through Store. */
(function () {
  'use strict';
  const B = window.BANK;
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const today = () => new Date().toLocaleDateString('en-CA');
  const addDays = (d, n) => { const x = new Date(d + 'T12:00:00'); x.setDate(x.getDate() + n); return x.toLocaleDateString('en-CA'); };
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const pick = a => a[Math.random() * a.length | 0];
  const VLABEL = { recall: 'Recall', reverse: 'Reverse', apply: 'Applied', num: 'Number', not: 'NOT / except', tf: 'True or false', why: 'Why?', scen: 'Scenario' };
  const INTERVAL = [0, 1, 3, 7, 14, 30];
  // Line icons (lucide paths), one size and stroke everywhere.
  const svgI = d => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  const I = {
    x: svgI('<path d="M18 6 6 18"/><path d="m6 6 12 12"/>'),
    left: svgI('<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>'),
    right: svgI('<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>'),
    chev: svgI('<path d="m9 18 6-6-6-6"/>'),
    flame: svgI('<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>'),
  };

  // ───────────── data index ─────────────
  const CON = {}; B.concepts.forEach(c => (CON[c.id] = c));
  const NODE = {}; B.nodes.forEach(n => (NODE[n.id] = n));
  function qOf(c, i) {
    const q = c.q[i];
    if (q[0] === 'tf') return { id: c.id + '#' + i, cid: c.id, v: 'tf', prompt: q[1], answers: ['True', 'False'], correct: q[2] ? 'True' : 'False', fixed: true };
    return { id: c.id + '#' + i, cid: c.id, v: q[0], prompt: q[1], answers: q.slice(2), correct: q[2] };
  }
  function whyOf(c) { const w = c.why; return { id: c.id + '#why', cid: c.id, v: 'why', prompt: w[0], answers: w.slice(1), correct: w[1] }; }

  // ───────────── state ─────────────
  const DEF = () => ({ v: 1, settings: { mode: 'core', recall: false, fr: false }, cs: {}, xp: 0, streak: { last: '', n: 0 }, boss: {}, mock: [], scen: {}, recallStats: { hit: 0, part: 0, miss: 0 } });
  let S = DEF();
  const save = () => Store.save(S);
  const cs = id => (S.cs[id] ??= { ok: [], days: [], why: false, miss: 0, box: 0, due: '', lastOk: 0, lastBad: 0 });

  const inScope = c => S.settings.mode === 'full' || !B.FULL_ONLY.includes(c.id);
  const scoped = () => B.concepts.filter(c => NODE[c.n].sec === 'moto' && inScope(c));
  const SCN = {}; B.scen.forEach(s => s.steps.forEach((st, i) => { const r = st.choices.find(ch => ch[1]); if (r) SCN[r[3]] = (SCN[r[3]] || 0) + 1; }));
  const need = c => Math.max(1, Math.min(3, c.q.length + (SCN[c.id] || 0))); // scenario steps count as extra versions
  function status(c) {
    const r = S.cs[c.id]; if (!r || (!r.ok.length && !r.miss)) return 'new';
    if (r.lastBad > r.lastOk) return 'shaky';
    if (r.ok.length >= need(c) && r.days.length >= 2 && r.why) return 'mastered';
    return 'learning';
  }
  function strength(c) {
    const r = S.cs[c.id]; if (!r) return 0;
    return Math.min(r.ok.length, need(c)) / need(c) * 0.6 + Math.min(r.days.length, 2) / 2 * 0.2 + (r.why ? 0.2 : 0) - (r.lastBad > r.lastOk ? 0.25 : 0);
  }
  const STATUS_TXT = { new: 'Not started', learning: 'Learning', shaky: 'Shaky — missed recently', mastered: 'Mastered' };
  const masteryRule = 'Mastered = right on 3 different versions of the concept (or every version it has), on 2 different days, plus the “why” question.';

  function record(cid, itemId, ok, isWhy) {
    const r = cs(cid), now = Date.now(), d = today();
    if (ok) {
      if (isWhy) r.why = true; else if (!r.ok.includes(itemId)) r.ok.push(itemId);
      if (!r.days.includes(d)) r.days.push(d); r.days = r.days.slice(-8);
      r.lastOk = now; r.box = Math.min(r.box + 1, INTERVAL.length - 1); r.due = addDays(d, INTERVAL[r.box]);
      S.xp += isWhy ? 5 : 10;
    } else {
      const wasMastered = status(CON[cid]) === 'mastered';
      r.miss++; r.lastBad = now; r.box = 0; r.due = d;
      if (wasMastered) r.days = []; // must re-earn the 2-day spread
    }
    if (S.streak.last !== d) { S.streak.n = S.streak.last === addDays(d, -1) ? S.streak.n + 1 : 1; S.streak.last = d; }
    save();
  }

  // ───────────── question selection ─────────────
  function variantFor(c, avoid = new Set()) {
    const r = S.cs[c.id], okSet = new Set(r ? r.ok : []);
    const idx = c.q.map((_, i) => i).filter(i => !avoid.has(c.id + '#' + i));
    const fresh = idx.filter(i => !okSet.has(c.id + '#' + i));
    const i = pick(fresh.length ? fresh : idx.length ? idx : c.q.map((_, i) => i));
    return qOf(c, i);
  }
  function priority(c) {
    const r = S.cs[c.id], st = status(c), d = today();
    if (st === 'shaky') return 0;
    if (r && r.due && r.due <= d && st !== 'mastered') return 1;
    if (r && r.due && r.due <= d) return 2;
    if (st === 'new') return 3;
    return 4 + strength(c);
  }
  function burstSet(n = 10) {
    const pool = shuffle(scoped()).sort((a, b) => priority(a) - priority(b));
    let newCount = 0; const out = [];
    for (const c of pool) { if (status(c) === 'new') { if (newCount >= 4) continue; newCount++; } out.push(c); if (out.length >= n) break; }
    return shuffle(out).map(c => variantFor(c));
  }
  function nodeSet(nid, n = 10) {
    const cs_ = scopedNode(nid).sort((a, b) => strength(a) - strength(b)); const out = []; const used = new Set();
    let k = 0; while (out.length < n && cs_.length) { const c = cs_[k++ % cs_.length]; const q = variantFor(c, used); used.add(q.id); out.push(q); if (k > n * 4) break; }
    return shuffle(out);
  }
  const scopedNode = nid => B.concepts.filter(c => c.n === nid && inScope(c));
  function examSet(concepts, n) {
    const all = []; concepts.forEach(c => c.q.forEach((_, i) => all.push(qOf(c, i))));
    const byC = {}; shuffle(all).forEach(q => (byC[q.cid] ??= []).push(q));
    const out = []; let round = 0;
    while (out.length < n && round < 6) { for (const cid of shuffle(Object.keys(byC))) { const q = byC[cid][round]; if (q) out.push(q); if (out.length >= n) break; } round++; }
    return shuffle(out);
  }

  // ───────────── UI shell ─────────────
  const app = $('#app');
  let cleanup = [];
  function view(html) { cleanup.forEach(f => f()); cleanup = []; app.innerHTML = html; window.scrollTo(0, 0); }
  function toast(t) { const el = document.createElement('div'); el.className = 'toast'; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 1800); }
  function chips() {
    const s = S.settings;
    $('#chips').innerHTML = `
      <button class="chip" data-set="mode" title="Core = Chapters 1–3, licence rules and gear. Full = whole guide.">${s.mode === 'core' ? 'Core mode' : 'Full mode'}</button>
      <button class="chip ${s.recall ? 'on' : ''}" data-set="recall" aria-pressed="${s.recall}" title="Type your answer before the options appear">Recall ${s.recall ? 'on' : 'off'}</button>
      <button class="chip ${s.fr ? 'on' : ''}" data-set="fr" aria-pressed="${s.fr}" title="Show French terms next to key concepts">FR ${s.fr ? 'on' : 'off'}</button>
      <span class="tally hide-s" title="Daily streak">${I.flame}${S.streak.n}</span><span class="tally hide-s">${S.xp.toLocaleString('en-CA')} XP</span>`;
  }
  document.addEventListener('click', e => {
    const set = e.target.closest('[data-set]');
    if (set) { const k = set.dataset.set; if (k === 'mode') S.settings.mode = S.settings.mode === 'core' ? 'full' : 'core'; else S.settings[k] = !S.settings[k]; save(); chips(); route(); return; }
    const go = e.target.closest('[data-go]'); if (go) { location.hash = go.dataset.go; }
  });
  window.addEventListener('hashchange', route);
  function route() {
    chips();
    const [r, a] = (location.hash.slice(1) || 'home').split('/');
    ({ home, campaign, node: () => nodeView(a), drill: () => startQuiz({ title: NODE[a].title + ' drill', items: nodeSet(a), why: true, back: 'node/' + a }),
      boss: () => startQuiz({ title: NODE[a].title + ' — boss round', items: examSet(scopedNode(a), Math.min(15, scopedNode(a).reduce((s, c) => s + c.q.length, 0))), exam: true, pass: 0.85, back: 'node/' + a, boss: a }),
      burst: () => startQuiz({ title: '5-minute burst', items: burstSet(10), why: true, back: 'home', timer: 300 }),
      mock: () => startQuiz({ title: 'Mock test — motorcycle section', items: examSet(scoped(), 30), exam: true, pass: 0.85, back: 'home', mock: true }),
      concept: () => startQuiz({ title: CON[a].t, items: conceptSet(a), why: true, back: 'map' }),
      scen: scenList, play: () => scenPlay(a), map: mapView, lab: labView, diagrams, settings }[r] || home)();
  }
  function conceptSet(cid) { const c = CON[cid], used = new Set(), out = []; for (let i = 0; i < Math.min(3, c.q.length); i++) { const q = variantFor(c, used); used.add(q.id); out.push(q); } return out; }

  // ───────────── home ─────────────
  function home() {
    const all = scoped(), cnt = { mastered: 0, learning: 0, shaky: 0, new: 0 };
    all.forEach(c => cnt[status(c)]++);
    const pct = k => (cnt[k] / all.length * 100).toFixed(2) + '%';
    const due = all.filter(c => { const r = S.cs[c.id]; return r && r.due && r.due <= today(); }).length;
    const best = S.mock.length ? Math.max(...S.mock.map(x => x.score)) : null;
    const stops = routeStops(), k = stops.length, ci = stops.findIndex(x => x.cur), cur = stops[ci];
    const paint = ci < 0 ? '100%' : ((ci + 0.5) / k * 100).toFixed(2) + '%';
    const chapters = []; stops.forEach(x => { const last = chapters[chapters.length - 1]; if (last && last.ch === x.ch) last.span++; else chapters.push({ ch: x.ch, span: 1 }); });
    const ridden = B.scen.filter(s => S.scen[s.id] != null).length;
    view(`
      <section class="hero">
        <div>
          <div class="eyebrow">SAAQ Class 6R knowledge test · motorcycle section · pass mark 85%</div>
          <h1>Ride the guide, not the question bank</h1>

        </div>

          <div class="stack" role="img" aria-label="${cnt.mastered} mastered, ${cnt.learning} learning, ${cnt.shaky} shaky, ${cnt.new} not started"><i class="mastered" style="width:${pct('mastered')}"></i><i class="learning" style="width:${pct('learning')}"></i><i class="shaky" style="width:${pct('shaky')}"></i></div>
          <ul class="legend"><li><span class="dot mastered"></span>Mastered<b>${cnt.mastered}</b></li><li><span class="dot learning"></span>Learning<b>${cnt.learning}</b></li><li><span class="dot shaky"></span>Shaky<b>${cnt.shaky}</b></li><li><span class="dot"></span>Not started<b>${cnt.new}</b></li></ul>
          <div class="meta">${due} due today · best mock ${best !== null ? Math.round(best * 100) + '%' : 'not taken'}</div>
        </aside>
      </section>
      <section class="card route">
        <div class="route-h">
          <div><div class="sub">Campaign route</div>
            <div class="route-next">${cur ? `Next stop <b>${cur.num}. ${esc(cur.n.title)}</b> <span class="meta mono">pp. ${cur.n.pages}</span>` : '<b>Every stop mastered</b>'}</div></div>
          <button class="btn" data-go="${cur ? 'node/' + cur.n.id : 'campaign'}">${cur ? 'Open stop' : 'Campaign'}${I.right}</button>
        </div>

          <span class="paint"></span><span class="paint on" style="--p:${paint}"></span>
          ${stops.map(x => `<button class="s ${x.done ? 'done' : x.cur ? 'cur' : x.st.sh ? 'shaky' : ''}" data-go="node/${x.n.id}" title="${x.num}. ${esc(x.n.title)} · ${x.st.m}/${x.st.n} mastered" aria-label="Stop ${x.num}, ${esc(x.n.title)}, ${x.st.m} of ${x.st.n} mastered"><i></i></button>`).join('')}
        </div>
        <div class="chapters" style="--k:${k}">${chapters.map(c => `<span style="grid-column:span ${c.span}">${CH_SHORT[c.ch]}</span>`).join('')}</div>
      </section>

  // ───────────── campaign ─────────────
  function nodeStats(nid) { const cc = scopedNode(nid); return { n: cc.length, m: cc.filter(c => status(c) === 'mastered').length, sh: cc.filter(c => status(c) === 'shaky').length }; }
  const CH_START = { n1: 'Before you ride', n2: 'Chapter 1 — Handling a motorcycle', n8: 'Chapter 2 — On the road', n12: 'Chapter 3 — Safe, cooperative, responsible', n16: 'Toolbox' };

  }
  function campaign() {

    let ch = null;
    routeStops().forEach(x => {
      if (x.ch !== ch) { ch = x.ch; html += `<div class="sec-h"><h3>${CH_START[ch]}</h3></div>`; }
      const { n, st } = x, boss = S.boss[n.id];
      html += `<div class="stop ${x.done ? 'done' : x.cur ? 'cur' : ''}"><button class="tile" data-go="node/${n.id}">
        <div class="row between"><div><div class="k">${x.num}. ${esc(n.title)}</div><div class="d">${esc(n.sub)} · <span class="mono">pp. ${n.pages}</span></div></div>
        <div class="stop-r"><div class="meta">${st.m}/${st.n} mastered${st.sh ? ` · <span class="k-r">${st.sh} shaky</span>` : ''}</div>
        <div class="bar"><i style="width:${st.m / st.n * 100}%"></i></div>
        <div class="meta ${boss >= 0.85 ? 'k-g' : ''}">${boss != null ? 'Boss best ' + Math.round(boss * 100) + '%' : 'Boss not tried'}</div></div></div></button></div>`;
    });
    html += `</div><div class="sec-h"><h3 class="lock">Section 2 — Highway Safety Code & signs (75%)</h3></div><div class="card lock sub">Locked. Built from the Driver’s Handbook after you confirm with the SAAQ whether you already passed this section.</div>`;

  // ───────────── quiz engine ─────────────
  function startQuiz(cfg) {
    const Q = { ...cfg, i: 0, score: 0, log: [], start: Date.now(), whyAsked: new Set() };
    if (!Q.items.length) { view(`<p>Nothing to drill here in ${S.settings.mode} mode.</p>`); return; }
    renderQ(Q);
    const key = e => {
      if (e.target.tagName === 'TEXTAREA') { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) $('#reveal')?.click(); return; }
      const n = parseInt(e.key, 10); if (n >= 1 && n <= 9) { const b = $$('.choice:not(:disabled)')[n - 1]; b && b.click(); }
      if (e.key === 'Enter') { const nx = $('#next'); nx && nx.click(); }
    };
    document.addEventListener('keydown', key); cleanup.push(() => document.removeEventListener('keydown', key));

  }
  function renderQ(Q, sub) {
    const q = sub || Q.items[Q.i], c = CON[q.cid];

    view(`<div class="q-top"><button class="btn ghost" data-go="${Q.back}">${I.x}Quit</button><strong>${esc(Q.title)}</strong>${Q.timer ? `<span id="timer" class="meta mono">${Q.timer / 60 | 0}:00</span>` : `<span class="meta mono">${Q.i + 1} / ${Q.items.length}</span>`}</div>

        <div class="choices" id="choices" ${recall ? 'hidden' : ''}>${answers.map((a, k) => `<button class="choice" data-a="${esc(a)}"><span class="n">${k + 1}</span><span>${esc(a)}</span></button>`).join('')}</div>

  }
  function answer(Q, q, btn, typed, isSub) {
    const ok = btn.dataset.a === q.correct, c = CON[q.cid];
    $$('.choice').forEach(b => { b.disabled = true; if (b.dataset.a === q.correct && (!Q.exam || isSub)) b.classList.add('right'); });
    if (!ok && (!Q.exam || isSub)) btn.classList.add('wrong');

    const recallLine = typed ? `<div class="sub" style="margin-top:8px;font-size:13px">You wrote: “${esc(typed)}”. Did your recall match? <span class="seg"><button data-rc="hit">Yes</button><button data-rc="part">Partly</button><button data-rc="miss">No</button></span></div>` : '';
    fb.innerHTML = `<div class="fb ${ok ? '' : 'bad'}"><strong>${ok ? 'Right' : 'Not quite'}</strong>${ok ? '' : ` · Answer: <strong>${esc(q.correct)}</strong>`}
      <div class="fact">${esc(c.f)}</div><div class="meta">Operating a Motorcycle, <span class="mono">p. ${c.p}</span></div>${recallLine}</div>${diagHTML(c.img)}${nextBtn}`;

  function advance(Q) {

  }
  function results(Q) {

  }

  // ───────────── scenarios ─────────────

      <div class="grid g2">${B.scen.map(s => `<button class="tile" data-go="play/${s.id}"><div class="k">${esc(s.title)}</div><div class="d">${esc(s.intro)}</div><div class="row" style="margin-top:12px;gap:8px"><span class="pill mono">pp. ${s.p}</span>${S.scen[s.id] != null ? `<span class="pill">Best ${Math.round(S.scen[s.id] * 100)}%</span>` : ''}</div></button>`).join('')}</div>`);

        <div class="choices" style="margin-top:12px">${shuffle(st.choices).map((ch, k) => `<button class="choice" data-k="${s.steps[i].choices.indexOf(ch)}"><span class="n">${k + 1}</span><span>${esc(ch[0])}</span></button>`).join('')}</div><div id="fb"></div></div>`);

  // ───────────── systems map ─────────────

    const ES = new Set(); cc.forEach(c => (c.links || []).forEach(l => { if (IN.has(l) && l !== c.id) ES.add([c.id, l].sort().join(' ')); }));
    const E = [...ES].map(x => x.split(' '));
    const DEF_P = `<h3>Pick a concept</h3><p class="sub">Each concept is one idea from the guide. Lines show the ideas it explains or depends on. Drilling a concept asks it in several different ways.</p>`;

    if (open) body += '</div>';
    view(`<button class="btn ghost" data-go="home">${I.left}Home</button>
      <div class="row between" style="margin:16px 0 12px;align-items:flex-end"><div><h2>Systems map</h2><div class="sub">Tap a concept to see what it affects and what affects it.</div></div>

    const mb = $('#mbody'), mp = $('#mpanel'), mL = $('#mlines'); let sel = null;
    function clear() {

      $$('.cpt', mb).forEach(r => { const on = r.dataset.c === id, n = nb.has(r.dataset.c); r.classList.toggle('on', on); r.classList.toggle('nb', n); r.setAttribute('aria-pressed', String(on)); if (on || n) r.closest('.sys').classList.add('nbs'); });
      mp.innerHTML = `<button class="btn ghost x" aria-label="Close">${I.x}</button><div class="meta">${esc(NODE[c.n].title)} · <span class="mono">p. ${c.p}</span></div><h3 style="margin-top:4px">${esc(c.t)}</h3>${S.settings.fr && c.fr ? `<div class="fr">FR · ${esc(c.fr)}</div>` : ''}
        <div class="row" style="gap:8px;margin:8px 0"><span class="dot ${st}"></span><span class="meta">${STATUS_TXT[st]}</span></div><p style="font-size:14px;margin-bottom:12px">${esc(c.f)}</p>
        ${nb.size ? `<div class="meta" style="margin-bottom:8px">Connected to</div><div class="row" style="gap:8px">${[...nb].map(n => `<button class="chip" data-side="${n}">${esc(CON[n].t)}</button>`).join('')}</div>` : ''}
        <div class="row" style="margin-top:12px"><button class="btn pri" data-go="concept/${id}">Drill this</button></div>`;
      $('.x', mp).onclick = clear;
      $$('[data-side]', mp).forEach(b => b.onclick = () => { pick(b.dataset.side); $(`.cpt[data-c="${b.dataset.side}"]`, mb).scrollIntoView({ block: 'center', behavior: 'smooth' }); });

    // Lines from the selected dot to each linked dot, in #mbody coordinates; drawn in shortest first.
    function drawLines() {
      const br = mb.getBoundingClientRect(); mL.replaceChildren(); mL.setAttribute('viewBox', `0 0 ${br.width} ${br.height}`);

      const ctr = el => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2 - br.left, r.top + r.height / 2 - br.top]; };
      const [x1, y1] = ctr($(`.cpt[data-c="${sel}"] .dot`, mb));
      const ps = $$('.cpt.nb .dot', mb).map(d => {
        const [x2, y2] = ctr(d), sign = x2 >= x1 ? 1 : -1, dx = Math.max(40, Math.abs(x2 - x1) / 2), sx = Math.max(x1, x2) + 64;
        const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        p.setAttribute('d', Math.abs(x2 - x1) < 24 ? `M ${x1} ${y1} C ${sx} ${y1}, ${sx} ${y2}, ${x2} ${y2}` : `M ${x1} ${y1} C ${x1 + dx * sign} ${y1}, ${x2 - dx * sign} ${y2}, ${x2} ${y2}`);
        mL.appendChild(p); return [p, p.getTotalLength()];
      }).sort((a, b) => a[1] - b[1]);
      // getTotalLength already styled each path at offset 0, so park it at its length with transitions off, flush, then switch them back on
      ps.forEach(([p, L]) => { p.style.transition = 'none'; p.style.strokeDasharray = p.style.strokeDashoffset = L + 'px'; });
      mL.getBoundingClientRect();
      ps.forEach(([p], i) => { p.style.transition = ''; p.style.transitionDelay = i * 24 + 'ms'; });
      requestAnimationFrame(() => ps.forEach(([p]) => { p.style.strokeDashoffset = '0px'; }));
    }
    const ro = new ResizeObserver(() => drawLines()); ro.observe(mb); cleanup.push(() => ro.disconnect());
    document.fonts.ready.then(drawLines);
    mb.addEventListener('click', e => { const r = e.target.closest('.cpt'); if (r) pick(r.dataset.c); else if (sel) clear(); });
    const key = e => { if (e.key === 'Escape' && sel) clear(); };
    document.addEventListener('keydown', key); cleanup.push(() => document.removeEventListener('keydown', key));
  }

  // ───────────── physics lab ─────────────
  function labView() {
    // Guide gives: KE ∝ v² (90 vs 45 = 4×); stopping = perception + reaction + braking; fatigue → reaction up to 2×;
    // FOV ≈150°/100°/75°/45° at 0/40/70/100 km/h; 2-second rule; dry concrete ≈10× ice friction.
    // Times and friction values below are ILLUSTRATIVE physics, not figures from the guide.
    const MU = { dry: 0.8, wet: 0.5, gravel: 0.35, ice: 0.08 };
    const P = { v: 50, surf: 'dry', tires: 'good', state: 'alert' };
    const fovAt = v => { const pts = [[0, 150], [40, 100], [70, 75], [100, 45]]; if (v >= 100) return 45; for (let i = 1; i < pts.length; i++) if (v <= pts[i][0]) { const [a, fa] = pts[i - 1], [b, fb] = pts[i]; return fa + (fb - fa) * (v - a) / (b - a); } };
    const calc = () => { const ms = P.v / 3.6, mu = MU[P.surf] * (P.tires === 'worn' ? 0.75 : 1), k = P.state === 'tired' ? 2 : 1; const pd = ms * 0.75, rd = ms * 0.75 * k, bd = ms * ms / (2 * mu * 9.81); return { ms, pd, rd, bd, tot: pd + rd + bd, ke: (P.v / 45) ** 2, fov: fovAt(P.v), two: ms * 2 }; };
    view(`<button class="btn ghost" data-go="home">${I.left}Home</button><h2 class="page-h">Physics lab</h2>
      <p class="page-sub">Move one thing, predict, then watch. The bands on your lane are perception (yellow), reaction (orange), braking (red). Outside the dark wedge is what your eyes drop at that speed.</p>
      <div class="lab"><canvas id="road"></canvas></div>
      <div class="grid g2" style="margin-top:12px"><div class="card">
        <div class="ctl"><label for="sv">Speed</label><input id="sv" type="range" min="10" max="130" step="5" value="${P.v}"><span class="read k-y" id="svo"></span></div>
        <div class="ctl"><label for="ss">Surface</label><select id="ss"><option value="dry">Dry pavement</option><option value="wet">Wet pavement</option><option value="gravel">Gravel</option><option value="ice">Ice</option></select><span></span></div>
        <div class="ctl"><label for="st">Tires</label><select id="st"><option value="good">Good</option><option value="worn">Worn</option></select><span></span></div>
        <div class="ctl"><label for="sr">Rider</label><select id="sr"><option value="alert">Alert</option><option value="tired">Tired (reaction ×2)</option></select><span></span></div>
        <p class="meta" style="margin-top:12px">Friction values and the 0.75 s perception + 0.75 s reaction times are illustrative textbook physics, not numbers from the guide. The guide’s own numbers are in the right panel.</p></div>
        <div class="card" id="out"></div></div>
      <div class="card" style="margin-top:12px"><h3>Predict first</h3><div id="pred"></div></div>`);
    const out = $('#out'), road = $('#road');
    const draw = () => { const r = calc(); $('#svo').textContent = P.v + ' km/h';
      out.innerHTML = `<div class="grid g2 readout">
        <div><div class="meta">Perception</div><div class="read k-y">${r.pd.toFixed(0)} m</div></div>
        <div><div class="meta">Reaction</div><div class="read k-o">${r.rd.toFixed(0)} m</div></div>
        <div><div class="meta">Braking</div><div class="read k-r">${r.bd.toFixed(0)} m</div></div>
        <div><div class="meta">Stopping distance</div><div class="read">${r.tot.toFixed(0)} m</div></div></div>
        <hr>
        <div class="meta" style="margin-bottom:8px">From the guide</div>
        <div class="lab-ref">Kinetic energy vs 45 km/h: <strong class="k-y">×${r.ke.toFixed(r.ke < 10 ? 1 : 0)}</strong> <span class="sub">(physics; the guide’s example: 45→90 km/h = 4×, p. 31)</span></div>
        <div class="lab-ref">Field of vision: <strong class="k-y">~${Math.round(r.fov)}°</strong> <span class="sub">(150/100/75/45° at 0/40/70/100, p. 92)</span></div>
        <div class="lab-ref">2-second margin = <strong>${r.two.toFixed(0)} m</strong> at this speed <span class="sub">(p. 97)</span></div>
        <div class="lab-ref">Eyes off road 5 s = <strong>${(r.ms * 5).toFixed(0)} m</strong> blind <span class="sub">(4–6 s at 90 km/h ≈ a football field, p. 135)</span></div>`; };
    const bind = (id, k, num) => $(id).addEventListener('input', e => { P[k] = num ? +e.target.value : e.target.value; draw(); });
    bind('#sv', 'v', true); bind('#ss', 'surf'); bind('#st', 'tires'); bind('#sr', 'state'); draw();
    const gl = GL.road(road, () => { const r = calc(); return { speed: P.v, pd: r.pd, rd: r.rd, bd: r.bd, fov: r.fov, wet: P.surf === 'wet' ? 1 : 0 }; });
    if (gl) cleanup.push(() => gl.stop()); else road.outerHTML = '<div class="card sub">WebGL2 isn’t available in this browser; the numbers still work.</div>';
    // predict challenges (all answers derivable from the guide)
    const CH = [
      () => { const a = pick([30, 40, 45, 50, 60]), m = 2; return { q: `You go from ${a} to ${a * m} km/h. Kinetic energy is multiplied by…`, a: String(m * m), opts: [String(m), String(m * m), String(m * 2), String(m * m * m)], set: a * m, cid: 'phys-ke' }; },
      () => ({ q: 'You become tired; same speed. The distance covered during your reaction…', a: 'can double', opts: ['can double', 'stays the same', 'halves', 'grows 10×'], set: null, state: 'tired', cid: 'drv-fatigue' }),
      () => ({ q: 'You speed up from 40 to 100 km/h. Your field of vision goes from about 100° to…', a: '45°', opts: ['45°', '75°', '100°', '150°'], set: 100, cid: 'vis-field' }),
      () => ({ q: 'Road goes from dry concrete to ice. The guide says dry concrete’s coefficient of friction is about…', a: '10× that of ice', opts: ['10× that of ice', 'equal to ice', '2× that of ice', '100× that of ice'], surf: 'ice', cid: 'phys-traction' }),
    ];
    const newPred = () => { const c = pick(CH)(); const box = $('#pred');
      box.innerHTML = `<p style="font-weight:600;margin:12px 0">${esc(c.q)}</p><div class="choices">${shuffle(c.opts).map((o, k) => `<button class="choice" data-o="${esc(o)}"><span class="n">${k + 1}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
      $$('.choice', box).forEach(b => b.onclick = () => { const ok = b.dataset.o === c.a; $$('.choice', box).forEach(x => { x.disabled = true; if (x.dataset.o === c.a) x.classList.add('right'); }); if (!ok) b.classList.add('wrong');
        record(c.cid, 'lab:' + c.q.slice(0, 24), ok, false);
        if (c.set) { P.v = c.set; $('#sv').value = c.set; } if (c.state) { P.state = c.state; $('#sr').value = c.state; } if (c.surf) { P.surf = c.surf; $('#ss').value = c.surf; } draw();
        box.insertAdjacentHTML('beforeend', `<div class="row" style="margin-top:12px"><span class="${ok ? 'k-g' : 'k-r'}">${ok ? 'Right — now look at the road' : 'Answer: ' + esc(c.a)}</span><button class="btn" id="np">Another</button></div>`); $('#np').onclick = newPred; }); };
    newPred();
  }

  // ───────────── diagrams + settings ─────────────
  function diagrams() {
    const keys = Object.keys(window.SVGS);
    view(`<button class="btn ghost" data-go="home">${I.left}Home</button><h2 class="page-h">Diagrams</h2><p class="page-sub">Redrawn diagram beside the guide’s original illustration.</p>
      <div class="grid">${keys.map(k => `<div class="card" id="d-${k}"><div class="row between"><h3>${k}</h3><span class="pill mono">${window.CROPS[k] ? 'Book p. ' + window.CROPS[k] : 'No original'}</span></div>
      <div class="grid g2" style="margin-top:8px"><div class="diag">${window.SVGS[k]}</div>${window.CROPS[k] && window.CONFIG.bookCrops ? `<div class="diag"><img alt="Original illustration, p. ${window.CROPS[k]}" src="${window.CROPIMG[k]}"></div>` : window.CROPS[k] ? `<div class="diag sub">See the guide, p. ${window.CROPS[k]}</div>` : '<div class="diag sub">The guide has no illustration for this one.</div>'}</div></div>`).join('')}</div>`);
  }
  function settings() {
    const rs = S.recallStats, st = Store.status();
    view(`<button class="btn ghost" data-go="home">${I.left}Home</button><h2 class="page-h" style="margin-bottom:20px">Settings & data</h2>
      <div class="grid g2 settings">
      <div class="card"><h3>Mode</h3><p class="sub">Core: Chapters 1–3, licence rules and protective gear. Full: the whole guide, including buying, storage, eco-driving, modulator specs and the accident scene. SAAQ doesn’t publish which pages are tested, so Core is a best-guess focus.</p><button class="btn" data-set="mode">Switch to ${S.settings.mode === 'core' ? 'Full' : 'Core'}</button></div>
      <div class="card"><h3>Recall mode</h3><p class="sub">Type your answer before the options appear. Self-rated so far: ${rs.hit} yes · ${rs.part} partly · ${rs.miss} no.</p><button class="btn" data-set="recall">${S.settings.recall ? 'Turn off' : 'Turn on'}</button></div>
      <div class="card"><h3>French terms</h3><p class="sub">Shows common Québec French terms next to key concepts. They weren’t checked against <em>Conduire une moto</em>, so treat them as a guide.</p><button class="btn" data-set="fr">${S.settings.fr ? 'Hide' : 'Show'}</button></div>
      <div class="card progress-card"><h3>Your progress</h3><p class="sub">${Store.adapterName === 'local' ? 'Saved in this browser on this device.' : `Saved to your account and synced across your devices. Signed in as <span class="mono">${esc(Store.email)}</span>.`}</p>
        <p class="meta sync-line"><span class="dot ${st.pending ? 'wait' : 'ok'}"></span>${!st.pending ? 'All changes synced' : st.error ? 'Changes saved on this device, waiting to sync' : 'Syncing…'}</p>
        <div class="row"><button class="btn" id="exp">Export progress (JSON)</button><button class="btn" id="imp">Import progress (JSON)</button><input type="file" id="impf" accept="application/json,.json" hidden><span class="push"></span><button class="btn ghost" id="out">Sign out</button><button class="btn danger" id="rst">Reset everything</button></div></div>
      </div>
      <div class="card" style="margin-top:12px"><h3>Answer-key quirks in the guide</h3><p class="sub">The guide’s own exercise keys don’t always match its text. Laws of Physics key (p. 175) lists “12, 15” as true: there is no #15, and #12 (gripping the bars absorbs impact) contradicts p. 32, so it looks shifted by one. The p. 182 key leaves out #1 (eyes give ~90% of information) although pp. 14 and 91 state it. This app follows the guide’s body text; where a key and the text agree, the app uses the key.</p></div>
      <p class="meta" style="margin-top:16px">Source: SAAQ, <em>Operating a Motorcycle</em>, 4th edition (2025). Page numbers are the printed page numbers. This is an unofficial study tool.</p>`);
    $('#exp').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([Store.exportJSON() || '{}'], { type: 'application/json' })); a.download = 'moto6r-progress.json'; a.click(); };
    $('#imp').onclick = () => $('#impf').click();
    $('#impf').onchange = async ev => {
      const f = ev.target.files[0]; let obj = null;
      if (!f) return;
      try { obj = JSON.parse(await f.text()); } catch (e) { console.warn('[moto6r] import: file is not readable JSON', e); }
      ev.target.value = '';
      if (!obj || typeof obj !== 'object' || obj.v !== 1) { toast('That file isn’t a 6R Ride Prep progress export'); return; }
      if (!confirm('Replace the progress on your account with this file?')) return;
      S = hydrate(obj); save(); route(); toast('Progress imported');
    };
    $('#out').onclick = async () => { const r = await Store.signOut(); if (r === 'pending') toast('Some changes haven’t synced yet. Reconnect, wait a moment, then sign out'); };
    $('#rst').onclick = async () => { if (!confirm('Erase all progress on your account? This clears it on every device.')) return; await Store.reset(); S = DEF(); save(); route(); toast('Progress reset'); };
  }

  // ───────────── boot ─────────────
  const hydrate = saved => Object.assign(DEF(), saved, { settings: Object.assign(DEF().settings, saved.settings) });
  (async () => {
    await Store.ready;
    const saved = await Store.load();
    if (saved && saved.v === 1) S = hydrate(saved);
    route();
  })();
  Store.onRemote(saved => { if (!saved || saved.v !== 1) return; S = hydrate(saved); route(); toast('Progress updated from your other device'); });
  window.__app = { status, CON, hydrate, get S() { return S; } };
})();
</script>
</body>
